<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>FUTURE·FIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani',sans-serif; }

  :root {
    --bg:#0b0f17;
    --panel:rgba(18,26,40,0.9);
    --glass:rgba(10,20,30,0.55);
    --border:rgba(0,255,200,0.22);
    --text:#e3f2fd;
    --text-dim:#7f96a6;
    --accent:#00e5ff;
    --accent-glow:0 0 12px rgba(0,229,255,0.55);
    --income:#00e676;
    --expense:#ff5252;
    --shadow:0 8px 24px rgba(0,0,0,0.6);
  }
  body.light-theme {
    --bg:#eef2f6;
    --panel:rgba(255,255,255,0.92);
    --glass:rgba(240,248,255,0.75);
    --border:rgba(0,120,150,0.28);
    --text:#0a1a2a;
    --text-dim:#4a6472;
    --accent:#0077b6;
    --accent-glow:0 0 10px rgba(0,119,182,0.35);
    --income:#0d8a4a;
    --expense:#c62828;
    --shadow:0 6px 18px rgba(0,0,0,0.12);
  }

  html,body {
    height:100%;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    transition:background .3s,color .3s;
  }
  body {
    display:flex; align-items:center; justify-content:center;
    padding:6px;
  }

  .app {
    position:relative;
    width:100%; max-width:1300px; height:100%; max-height:100vh;
    display:flex; flex-direction:column;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:10px 14px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    transition:background .3s,border .3s;
  }
  .app::before {
    content:''; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
    background-size:36px 36px;
    border-radius:26px;
    pointer-events:none;
  }

  /* ---------- HEADER ---------- */
  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:6px; border-bottom:1px solid var(--border);
    flex-shrink:0; gap:10px;
  }
  .month-nav {
    display:flex; align-items:center; gap:8px;
  }
  .nav-btn {
    background:transparent; border:1px solid var(--border);
    color:var(--accent); font-family:'Rajdhani',sans-serif;
    font-size:1.1rem; font-weight:700; line-height:1;
    width:30px; height:30px; border-radius:50%;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .2s;
  }
  .nav-btn:hover {
    background:var(--glass);
    box-shadow:var(--accent-glow);
    border-color:var(--accent);
  }
  .nav-btn:disabled { opacity:.25; cursor:not-allowed; box-shadow:none; }

  .month-display {
    font-weight:700; font-size:1.35rem; letter-spacing:2px;
    text-transform:uppercase;
    background:linear-gradient(135deg,var(--accent),#a0f0ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    text-shadow:var(--accent-glow);
    min-width:180px; text-align:center;
  }
  .theme-toggle {
    background:transparent; border:1px solid var(--border);
    color:var(--text); font-family:'Rajdhani',sans-serif;
    font-size:.95rem; font-weight:600; letter-spacing:1px;
    padding:5px 14px; border-radius:40px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:all .2s;
  }
  .theme-toggle:hover {
    background:var(--glass); border-color:var(--accent);
    box-shadow:var(--accent-glow);
  }

  /* ---------- COLUMNS ---------- */
  .columns {
    display:flex; flex:1; gap:12px; min-height:0;
    padding:8px 0 6px;
  }
  .col {
    flex:1; display:flex; flex-direction:column;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:18px;
    padding:10px 12px;
    min-height:0;
    backdrop-filter:blur(8px);
  }
  .col-title {
    font-size:1rem; font-weight:700; letter-spacing:3px;
    text-transform:uppercase; color:var(--accent);
    text-shadow:var(--accent-glow);
    border-left:3px solid var(--accent);
    padding-left:8px; margin-bottom:8px;
    flex-shrink:0;
  }

  /* ---------- INCOME ---------- */
  .income-item {
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(0,200,200,.05);
    padding:6px 10px; border-radius:10px;
    border:1px solid transparent;
    margin-bottom:8px;
    transition:border .2s;
  }
  .income-item:hover { border-color:var(--border); }
  .income-label {
    font-weight:600; letter-spacing:1.5px;
    color:var(--text-dim); font-size:.85rem;
    text-transform:uppercase;
  }
  .flex-row { display:flex; align-items:center; gap:4px; }
  .currency { font-size:.85rem; opacity:.7; }
  .income-value, .expense-input, .locked-input {
    background:transparent; border:none; outline:none;
    color:var(--text); font-family:'Rajdhani',sans-serif;
    font-weight:700; text-align:right;
    padding:2px 6px; border-radius:8px;
    border:1px solid transparent;
    transition:all .2s;
  }
  .locked-input {
    color:var(--income); font-size:1.15rem; width:110px;
    background:rgba(0,200,200,.1);
    border:1px solid var(--border);
    cursor:not-allowed;
  }
  .income-value { font-size:1.15rem; width:110px; color:var(--income); }
  .income-value:focus {
    border-color:var(--accent);
    background:rgba(0,229,255,.1);
    box-shadow:var(--accent-glow);
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  input[type=number] { -moz-appearance:textfield; }

  /* ---------- EXPENSES ---------- */
  .expenses-list {
    flex:1; display:flex; flex-direction:column; gap:4px;
    min-height:0; overflow:hidden;
  }
  .expense-item {
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,82,82,.05);
    border:1px solid transparent;
    border-radius:10px;
    padding:2px 10px;
    flex:1; min-height:0;
    transition:border .2s;
  }
  .expense-item:hover { border-color:var(--expense); }
  .expense-name {
    font-weight:600; color:var(--text-dim);
    letter-spacing:1px; font-size:.82rem;
    text-transform:uppercase;
    flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .expense-input {
    width:100px; font-size:1.05rem; color:var(--expense);
  }
  .expense-input:focus {
    border-color:var(--expense);
    background:rgba(255,82,82,.1);
  }
  .expense-input::placeholder { color:var(--text-dim); opacity:.4; }

  /* ---------- BALANCE ---------- */
  .balance-bar {
    margin-top:6px; padding:10px 20px;
    background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(0,230,118,.08));
    border:1px solid var(--border);
    border-radius:20px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  .balance-label {
    font-size:1.1rem; font-weight:700; letter-spacing:3px;
    text-transform:uppercase; color:var(--accent);
    text-shadow:var(--accent-glow);
  }
  .balance-amount {
    font-size:2rem; font-weight:700; letter-spacing:1.5px; line-height:1;
    background:linear-gradient(135deg,var(--income),var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    text-shadow:0 0 18px rgba(0,229,255,.35);
  }
  .balance-amount.negative {
    background:linear-gradient(135deg,#ff5252,#ff8a80);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  /* ---------- COMPRESS ON SHORT SCREENS ---------- */
  @media (max-height:760px) {
    .app { padding:8px 12px; }
    .month-display { font-size:1.15rem; min-width:150px; }
    .col { padding:8px 10px; }
    .col-title { font-size:.85rem; margin-bottom:6px; }
    .income-item { padding:4px 8px; margin-bottom:6px; }
    .income-label { font-size:.75rem; }
    .income-value, .locked-input { font-size:1rem; width:95px; }
    .expense-item { padding:1px 8px; }
    .expense-name { font-size:.72rem; }
    .expense-input { font-size:.95rem; width:85px; }
    .balance-bar { padding:8px 16px; }
    .balance-label { font-size:.95rem; letter-spacing:2px; }
    .balance-amount { font-size:1.6rem; }
  }
  @media (max-height:620px) {
    .month-display { font-size:1rem; min-width:130px; letter-spacing:1px; }
    .col-title { font-size:.75rem; letter-spacing:2px; }
    .income-item { padding:2px 6px; margin-bottom:4px; }
    .income-label { font-size:.7rem; }
    .income-value, .locked-input { font-size:.9rem; width:85px; }
    .expense-item { padding:0 6px; }
    .expense-name { font-size:.66rem; }
    .expense-input { font-size:.85rem; width:75px; }
    .balance-amount { font-size:1.4rem; }
  }

  @media (max-width:720px) {
    .columns { flex-direction:column; gap:8px; }
    .month-display { font-size:1rem; min-width:120px; }
    .nav-btn { width:26px; height:26px; font-size:.95rem; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="month-nav">
      <button class="nav-btn" id="prevMonth" aria-label="Previous month">‹</button>
      <div class="month-display" id="monthDisplay">SEPTEMBER 2026</div>
      <button class="nav-btn" id="nextMonth" aria-label="Next month">›</button>
    </div>
    <button class="theme-toggle" id="themeToggle"><span>🌙</span> DARK</button>
  </div>

  <!-- COLUMNS -->
  <div class="columns">

    <!-- INCOME -->
    <div class="col">
      <div class="col-title">INCOME</div>

      <div class="income-item">
        <span class="income-label">SALARY</span>
        <div class="flex-row">
          <span class="currency">R</span>
          <input type="number" class="locked-input" id="salaryInput" value="14000" readonly>
        </div>
      </div>

      <div class="income-item">
        <span class="income-label">ALLOWANCE</span>
        <div class="flex-row">
          <span class="currency">R</span>
          <input type="number" class="income-value" id="allowanceInput" placeholder="0" inputmode="decimal">
        </div>
      </div>
    </div>

    <!-- EXPENSES -->
    <div class="col">
      <div class="col-title">EXPENSES</div>
      <div class="expenses-list" id="expensesList"></div>
    </div>
  </div>

  <!-- BALANCE -->
  <div class="balance-bar">
    <span class="balance-label">TOTAL BALANCE</span>
    <span class="balance-amount" id="totalBalance">R 0.00</span>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- CONFIG ---------- */
  const SALARY = 14000;
  const EXPENSE_NAMES = [
    'Lendplus','Crediwise','Primeloans','Sphiweloans','Janeloans',
    'The Dawn','Electricity','Levies','Transport','Payjustnow due','Payjustnow new'
  ];
  const MONTHS = [
    { label:'SEPTEMBER 2026', key:'2026-09' },
    { label:'OCTOBER 2026',   key:'2026-10' }
  ];

  /* ---------- STATE ---------- */
  // Each month gets its own independent store.
  // amounts stored as strings so we can preserve blank ('') for cleared fields.
  const store = {};
  MONTHS.forEach(m => {
    store[m.key] = {
      allowance: '',
      expenses: EXPENSE_NAMES.reduce((acc,n)=>{ acc[n]=''; return acc; },{})
    };
  });

  let currentIndex = 0; // 0 = Sept 2026

  /* ---------- DOM ---------- */
  const monthDisplay  = document.getElementById('monthDisplay');
  const prevBtn       = document.getElementById('prevMonth');
  const nextBtn       = document.getElementById('nextMonth');
  const themeToggle   = document.getElementById('themeToggle');
  const allowanceInput= document.getElementById('allowanceInput');
  const expensesList  = document.getElementById('expensesList');
  const totalBalanceEl= document.getElementById('totalBalance');

  /* ---------- HELPERS ---------- */
  function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
  function fmt(v){ return 'R ' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }

  function currentStore(){ return store[MONTHS[currentIndex].key]; }

  function calcTotalExpenses(){
    const s = currentStore();
    return EXPENSE_NAMES.reduce((sum,n)=> sum + num(s.expenses[n]), 0);
  }
  function calcTotalIncome(){
    return SALARY + num(currentStore().allowance);
  }
  function updateBalance(){
    const bal = calcTotalIncome() - calcTotalExpenses();
    totalBalanceEl.textContent = fmt(bal);
    totalBalanceEl.classList.toggle('negative', bal < 0);
  }

  /* ---------- RENDER EXPENSES ---------- */
  function renderExpenses(){
    const s = currentStore();
    expensesList.innerHTML = '';
    EXPENSE_NAMES.forEach(name=>{
      const item = document.createElement('div');
      item.className = 'expense-item';

      const label = document.createElement('span');
      label.className = 'expense-name';
      label.textContent = name;

      const wrap = document.createElement('div');
      wrap.className = 'flex-row';

      const cur = document.createElement('span');
      cur.className = 'currency';
      cur.textContent = 'R';

      const input = document.createElement('input');
      input.type = 'number';
      input.className = 'expense-input';
      input.inputMode = 'decimal';
      input.placeholder = '0';
      input.value = s.expenses[name];
      input.dataset.name = name;

      // allow blank / clear — store raw string
      input.addEventListener('input', (e)=>{
        const v = e.target.value;
        s.expenses[name] = v;
        updateBalance();
      });

      wrap.appendChild(cur);
      wrap.appendChild(input);
      item.appendChild(label);
      item.appendChild(wrap);
      expensesList.appendChild(item);
    });
  }

  /* ---------- RENDER ALL ---------- */
  function renderMonth(){
    monthDisplay.textContent = MONTHS[currentIndex].label;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === MONTHS.length - 1;

    const s = currentStore();
    allowanceInput.value = s.allowance;

    renderExpenses();
    updateBalance();
  }

  /* ---------- EVENTS ---------- */
  allowanceInput.addEventListener('input', (e)=>{
    currentStore().allowance = e.target.value;
    updateBalance();
  });

  prevBtn.addEventListener('click', ()=>{
    if(currentIndex > 0){ currentIndex--; renderMonth(); }
  });
  nextBtn.addEventListener('click', ()=>{
    if(currentIndex < MONTHS.length-1){ currentIndex++; renderMonth(); }
  });

  themeToggle.addEventListener('click', ()=>{
    const light = document.body.classList.toggle('light-theme');
    themeToggle.innerHTML = light ? '<span>☀️</span> LIGHT' : '<span>🌙</span> DARK';
  });

  /* ---------- INIT ---------- */
  renderMonth();
})();
</script>
</body>
</html>
